[package]
name = "cryptoally-api"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "cryptoally_api"
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "api/gateway.rs"

[dependencies]
vercel_runtime = { version = "2", features = ["axum"] }
axum = "0.8"
tower = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "postgres", "runtime-tokio", "tls-rustls", "chrono", "rust_decimal", "derive",
] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
once_cell = "1"
url = "2"
sha2 = "0.10"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
strip = true
