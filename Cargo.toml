[package]
name = "cryptoally-api"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "cryptoally_api"
path = "src/lib.rs"

[[bin]]
name = "index"
path = "api/index.rs"

[[bin]]
name = "health"
path = "api/health.rs"

[[bin]]
name = "assets"
path = "api/assets.rs"

[[bin]]
name = "prices"
path = "api/prices.rs"

[[bin]]
name = "robots"
path = "api/robots.rs"

[[bin]]
name = "sitemap"
path = "api/sitemap.rs"

[dependencies]
vercel_runtime = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "postgres", "runtime-tokio", "tls-rustls", "chrono", "rust_decimal", "derive",
] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
once_cell = "1"
url = "2"
sha2 = "0.10"

[profile.release]
strip = true
